[package]
name = "neonmix-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
subtle = "2"
mdns-sd = "=0.21.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.2", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.2", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.2", features = ["sync-secret-service", "crypto-rust", "vendored"] }
[lints]
workspace = true
