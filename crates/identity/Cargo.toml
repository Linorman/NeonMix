[package]
name = "neonmix-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
subtle = "2"
mdns-sd = "=0.21.4"
mdns_sd_scoped = { package = "mdns-sd", version = "=0.21.4", path = "../../vendor/mdns-sd-scoped" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_IO"] }
[dev-dependencies]
neonmix-control = { path = "../control" }

[lints]
workspace = true
