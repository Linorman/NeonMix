[package]
name = "neonmix-desktop-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
neonmix-airplay-adapter = { path = "../airplay-adapter" }
neonmix-control = { path = "../control" }
neonmix-identity = { path = "../identity" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemServices"] }

[lints]
workspace = true
