[workspace]
resolver = "2"
exclude = ["apps/airplay-worker", "apps/credential-migrate", "vendor/cpal", "vendor/tympan-aspl", "vendor/mdns-sd-scoped"]
members = ["crates/*", "adapters/*", "apps/*", "drivers/macos/hal"]
default-members = ["apps/audio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Linorman/NeonMix"

[workspace.dependencies]
neonmix-core = { path = "crates/audio-core" }
neonmix-io = { path = "crates/audio-io" }
cpal = "=0.18.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rubato = { version = "=0.16.2", default-features = false }
rtrb = "=0.3.2"
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 2
strip = false
lto = "thin"
codegen-units = 1

[patch.crates-io]
cpal = { path = "vendor/cpal" }
tympan-aspl = { path = "vendor/tympan-aspl" }
