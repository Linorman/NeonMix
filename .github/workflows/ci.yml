name: E00-E04 (native media on macOS)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.local/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      UV_CACHE_DIR: ${{ github.workspace }}/.local/uv
      MACOSX_DEPLOYMENT_TARGET: '14.6'
    steps:
      - uses: actions/checkout@v4
      - name: Project-local temporary files
        shell: bash
        run: |
          mkdir -p .local/tmp artifacts
          echo "TMPDIR=$GITHUB_WORKSPACE/.local/tmp" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/.local/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/.local/tmp" >> "$GITHUB_ENV"
      - name: Linux native headers
        if: runner.os == 'Linux'
        run: |
          tools/prepare_linux.sh
      - name: Apple Silicon and SDK gate
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          test "$(xcrun --show-sdk-version)" = 15.5
      - name: Pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Project-local GStreamer runtime (macOS media only)
        if: runner.os == 'macOS'
        run: tools/dev python3 tools/prepare_gstreamer.py
      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: tools/dev python3 tools/check.py
      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/dev.ps1 python tools/check.py
      - name: Collect Unix build and symbols
        if: runner.os != 'Windows'
        run: tools/dev python3 tools/collect_build.py
      - name: Collect Windows build and symbols
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/dev.ps1 python tools/collect_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neonmix-${{ matrix.os }}
          path: artifacts/
          retention-days: 30
