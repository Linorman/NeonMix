name: Stability regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Stability deterministic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.local/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.local/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Project-local temporary files (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p .local/tmp
          echo "TMPDIR=$GITHUB_WORKSPACE/.local/tmp" >> "$GITHUB_ENV"
          echo "TMP=$GITHUB_WORKSPACE/.local/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$GITHUB_WORKSPACE/.local/tmp" >> "$GITHUB_ENV"
      - name: Project-local temporary files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/tmp | Out-Null
          foreach ($name in @('TMPDIR', 'TMP', 'TEMP')) {
            "$name=$env:GITHUB_WORKSPACE/.local/tmp" >> $env:GITHUB_ENV
          }
      - name: Pinned project-local Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Deterministic checks (Unix)
        if: runner.os != 'Windows'
        run: tools/dev python3 tools/review_check.py
      - name: Deterministic checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/dev.ps1 python tools/review_check.py
      - name: Check results in the job summary
        if: always()
        shell: python
        run: |
          import json, os
          from pathlib import Path
          result = Path('artifacts/review-checks/result.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if result.exists():
                  data = json.loads(result.read_text())
                  summary.write('| Check | Exit code | Seconds |\n|---|---:|---:|\n')
                  for name, value in data.items():
                      summary.write(f"| {name} | {value['exit_code']} | {value['seconds']} |\n")
                  summary.write('\nArtifact upload is separate from these checks; its failure remains visible in the step log.\n')
              else:
                  summary.write('No check result was produced. Inspect the failed setup/check step.\n')
      - name: Archive check logs (optional)
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: stability-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/review-checks/
          retention-days: 30
