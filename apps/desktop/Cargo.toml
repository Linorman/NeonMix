[package]
name = "neonmix-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
[features]
screenshot = ["eframe/__screenshot", "dep:image"]
[dependencies]
neonmix-i18n = { path = "../../crates/i18n" }
neonmix-identity = { path = "../../crates/identity" }
sys-locale = "=0.3.2"
neonmix-airplay-adapter = { path = "../../crates/airplay-adapter" }
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
neonmix-core.workspace = true
serde_json.workspace = true
serde.workspace = true
clap.workspace = true
neonmix-control = { path = "../../crates/control" }
neonmix-desktop-service = { path = "../../crates/desktop-service" }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
tray-icon = { version = "=0.26.0", default-features = false, features = ["ksni"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSMenu", "NSStatusItem"] }
[lints]
workspace = true
