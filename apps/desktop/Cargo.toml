[package]
name = "neonmix-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
screenshot = ["eframe/__screenshot"]
[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
neonmix-core.workspace = true
serde_json.workspace = true
serde.workspace = true
clap.workspace = true
neonmix-control = { path = "../../crates/control" }
neonmix-desktop-service = { path = "../../crates/desktop-service" }
uuid = { version = "1", features = ["v4"] }
tray-icon = { version = "=0.26.0", default-features = false, features = ["ksni"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSMenu", "NSStatusItem"] }
[lints]
workspace = true
