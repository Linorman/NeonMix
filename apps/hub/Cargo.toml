[package]
name = "neonmix-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
neonmix-lifecycle = { path = "../../crates/lifecycle" }
neonmix-core.workspace = true
neonmix-airplay-ipc = { path = "../../crates/airplay-ipc" }
neonmix-airplay-adapter = { path = "../../crates/airplay-adapter" }
neonmix-io.workspace = true
neonmix-output-binding = { path = "../../crates/output-binding" }
neonmix-identity = { path = "../../crates/identity" }
neonmix-control = { path = "../../crates/control" }
neonmix-media = { path = "../../crates/media" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
rustls-pemfile = "2"
rubato.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
mio = { version = "1", features = ["os-poll", "net"] }
if-addrs = "=0.15.0"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
neonmix-macos = { path = "../../adapters/macos" }
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
[target.'cfg(target_os = "windows")'.dependencies]
neonmix-windows = { path = "../../adapters/windows" }
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
neonmix-linux = { path = "../../adapters/linux" }
[lints]
workspace = true
