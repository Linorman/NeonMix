[package]
name = "neonmix-credential-migrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-Proprietary"

[workspace]
resolver = "2"

[dependencies]
neonmix-identity = { path = "../../crates/identity" }
neonmix-control = { path = "../../crates/control" }
neonmix-output-binding = { path = "../../crates/output-binding" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", features = ["pem"] }
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.2", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.2", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.2", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
debug = 2
strip = false
