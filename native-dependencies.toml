plugin = "E06: AudioServerPlugIn build/signing/loading is a separate gate"

[gstreamer]
status = "E02 integration pending; not linked into E01 binaries"
api_baseline = "1.24"
required_plugins = ["app", "opus", "rtp", "rtpmanager", "udp", "dtls", "srtp"]
distribution_gate = "Lock full native patch versions, redistributables and licenses before E02 integration; bundle and probe plugins on each OS before E09 packaging. Cargo.lock alone is insufficient."

[linux_lab]
