# E00/E01 build baseline. Exact resolved Rust versions: Cargo.lock.
[rust]
toolchain = "1.95.0"
cpal = "0.18.2"
cpal_patch = "patches/cpal-0.18.2-native-position.patch"
pipewire_rs = "0.10.0"
rubato = "0.16.2"
eframe = "0.31.1"

[windows]
architecture = "x86_64"
product_baseline = "Windows 11 24H2"
ci_os = "windows-2025"
toolchain = "x86_64-pc-windows-msvc"
sdk_baseline = "10.0.26100.0"
wdk = "E06: not used by E00/E01 user-mode build; must be locked with chosen driver"

[linux]
architecture = "x86_64"
distribution = "Ubuntu 24.04 LTS"
pipewire_abi = "1.0.5 / libpipewire-0.3"
